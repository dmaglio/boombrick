# Pushing a tag like v0.5.0 builds the app for NextUI and for CrossMix with
# that version and publishes both, with their checksums, as a GitHub
# release. Boombrick's Settings offers the latest release as an update. A
# tag with a suffix, like v0.5.0-beta.1, is a beta: a pre-release, which
# GitHub's latest release, and so Settings, leaves out.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Makefile builds the toolchain image with the Go that go.mod asks for.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The toolchain's container writes as root; folders made first stay the
      # runner's, so the steps after it can write beside what it built.
      - name: Build
        run: |
          mkdir -p dist/tg5040 dist/qjs
          make pak crossmix VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        working-directory: dist
        run: sha256sum Boombrick.pak.zip Boombrick-CrossMix.zip > SHA256SUMS
      # The notes are the tag's section of CHANGELOG.md, from its "## [v…]"
      # heading to the next; GitHub's own when there is none.
      - name: Release notes
        run: |
          awk -v head="## [$GITHUB_REF_NAME]" '
            index($0, "## [") == 1 { if (on) exit; on = ($0 == head); next }
            on
          ' CHANGELOG.md > dist/NOTES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--notes-file dist/NOTES.md"
          grep -q '[^[:space:]]' dist/NOTES.md || flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/Boombrick.pak.zip dist/Boombrick-CrossMix.zip dist/SHA256SUMS \
            --title "Boombrick ${GITHUB_REF_NAME#v}" $flags
