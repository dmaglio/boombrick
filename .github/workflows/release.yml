# Pushing a tag like v0.5.0 builds the pak with that version and publishes it,
# with its checksum, as a GitHub release. Boombrick's Settings offers the
# latest release as an update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Makefile builds the toolchain image with the Go that go.mod asks for.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The toolchain's container writes as root; folders made first stay the
      # runner's, so the steps after it can write beside what it built.
      - name: Build the pak
        run: |
          mkdir -p dist/tg5040 dist/qjs
          make pak VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        working-directory: dist
        run: sha256sum Boombrick.pak.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/Boombrick.pak.zip dist/SHA256SUMS
          --title "Boombrick ${GITHUB_REF_NAME#v}" --generate-notes
